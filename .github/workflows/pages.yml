name: Publish explainer
on:
  push:
    branches: [main]
    paths: ['site/**', 'examples/diagrams/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, tart-ci-dedicated]
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site
      - uses: actions/deploy-pages@v4
        id: deployment
