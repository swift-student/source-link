name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build tools
        run: brew install xcodegen swiftlint
      - name: Install pinned formatter
        run: |
          bash scripts/ci/install-tools.sh
          echo "$GITHUB_WORKSPACE/.tools/ci/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain and tools
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          swiftlint version
          swiftformat --version
      - name: Build, test, lint, and check formatting
        run: make check
