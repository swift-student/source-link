name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package without signing or publishing
        type: boolean
        default: true
      version:
        description: Dry-run version (published versions always come from the tag)
        default: '1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF_TYPE" == tag ]] || { echo 'Publishing requires a version tag'; exit 1; }
            [[ "$GITHUB_REF_NAME" == v* ]] || exit 1
            version="${GITHUB_REF_NAME#v}"
            git merge-base --is-ancestor HEAD origin/main
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected version X.Y.Z'; exit 1; }
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check publishing credentials
        if: env.PUBLISH == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID HOMEBREW_TAP_DEPLOY_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret: $name. See docs/releasing.md."
              exit 1
            fi
          done
      - name: Install tools
        run: |
          brew install xcodegen swiftlint
          bash scripts/ci/install-tools.sh
          echo "$GITHUB_WORKSPACE/.tools/ci/bin" >> "$GITHUB_PATH"
      - name: Run checks
        run: make check
      - name: Import signing credentials
        if: env.PUBLISH == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash scripts/ci/import-signing.sh
      - name: Build, notarize, and package
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            bash scripts/release.sh publish
          else
            bash scripts/release.sh dry-run
          fi
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/source-link-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/source-link-signing.p12" "$RUNNER_TEMP/source-link-notary.p8" "$RUNNER_TEMP/notarize.zip"
      - name: Save dry-run artifacts (unsigned, not for distribution)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-dry-run
          path: .build/release/
          retention-days: 3
      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-release.sh
      - name: Check out Homebrew tap
        if: env.PUBLISH == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: swift-student/homebrew-tap
          path: .build/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Update Homebrew cask
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          cd .build/homebrew-tap
          mkdir -p Casks
          if [[ -f Casks/source-link.rb ]]; then
            current=$(sed -nE 's/^  version "([0-9.]+)"/\1/p' Casks/source-link.rb)
            ruby -e 'abort "Refusing to downgrade the tap" if Gem::Version.new(ARGV[0]) > Gem::Version.new(ARGV[1])' "$current" "$RELEASE_VERSION"
          fi
          cp ../release/source-link.rb Casks/source-link.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/source-link.rb
          if ! git diff --cached --quiet; then
            git commit -m "Release Source Link $RELEASE_VERSION"
            git push origin HEAD:main
          fi
