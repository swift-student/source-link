name: XedLink
options:
  bundleIdPrefix: com.shawngee
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0
  XedLinkPackage:
    path: ..
schemes:
  SettingsSnapshots:
    build:
      targets:
        SettingsSnapshotTests: all
    test:
      targets:
        - SettingsSnapshotTests
  XedLink:
    build:
      targets:
        XedLink: all
    test:
      targets:
        - XedLinkUITests
    run:
      config: Debug
targets:
  XedLink:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Source Link
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.shawngee.XedLink.source-link
            CFBundleURLSchemes:
              - source-link
        LSUIElement: true
    sources:
      - Sources/XedLinkApp
    dependencies:
      - package: XedLinkPackage
        product: XedLinkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shawngee.XedLink
        PRODUCT_NAME: source-link
        SWIFT_VERSION: 6.0
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          ENABLE_HARDENED_RUNTIME: NO

  SettingsSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/XedLinkApp
        excludes:
          - App.swift
      - path: Tests/SettingsSnapshotTests
        excludes:
          - __Snapshots__
    dependencies:
      - package: XedLinkPackage
        product: XedLinkCore
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  XedLinkUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/XedLinkUITests
    dependencies:
      - target: XedLink
      - package: XedLinkPackage
        product: XedLinkCore
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_TARGET_NAME: XedLink
