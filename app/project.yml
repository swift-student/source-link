name: SourceLink
options:
  bundleIdPrefix: com.shawngee
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0
  SourceLinkPackage:
    path: ../Packages/SourceLinkPackage
schemes:
  SourceLinkAppTests:
    build:
      targets:
        SourceLinkAppTests: all
    test:
      targets:
        - SourceLinkAppTests
  SettingsSnapshots:
    build:
      targets:
        SettingsSnapshotTests: all
    test:
      targets:
        - SettingsSnapshotTests
  SourceLink:
    build:
      targets:
        SourceLink: all
    test:
      targets:
        - SourceLinkUITests
    run:
      config: Debug
targets:
  SourceLink:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Source Link
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.shawngee.SourceLink.source-link
            CFBundleURLSchemes:
              - source-link
        LSUIElement: true
    sources:
      - Sources/SourceLinkApp
    dependencies:
      - package: SourceLinkPackage
        product: SourceLinkCore
      - target: SourceLinkCLI
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shawngee.SourceLink
        PRODUCT_NAME: source-link
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          ENABLE_HARDENED_RUNTIME: NO

  SourceLinkCLI:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - ../Packages/SourceLinkPackage/Sources/SourceLinkCLI
    dependencies:
      - package: SourceLinkPackage
        product: SourceLinkCore
    settings:
      base:
        PRODUCT_NAME: source-link
        PRODUCT_MODULE_NAME: SourceLinkCLI
        SWIFT_VERSION: 6.0
        SKIP_INSTALL: YES

  SettingsSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/SourceLinkApp
        excludes:
          - App.swift
      - path: Tests/SettingsSnapshotTests
        excludes:
          - __Snapshots__
    dependencies:
      - package: SourceLinkPackage
        product: SourceLinkCore
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

  SourceLinkUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Tests/SourceLinkUITests
    dependencies:
      - target: SourceLink
      - package: SourceLinkPackage
        product: SourceLinkCore
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_TARGET_NAME: SourceLink

  SourceLinkAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - Sources/SourceLinkApp/SettingsStore.swift
      - Sources/SourceLinkApp/SettingsStyle.swift
      - Sources/SourceLinkApp/SymbolPicker.swift
      - Tests/SourceLinkAppTests
    dependencies:
      - package: SourceLinkPackage
        product: SourceLinkCore
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
